# 丑团 · 容器内 nginx 站点配置（由 Dockerfile.prod 拷入）
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 健康检查（compose HEALTHCHECK 与部署验证用）
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","app":"choutuan"}';
    }

    # 产品图：内容按图池键寻址，长缓存
    location /img/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location ~* \.(js|css)$ {
        expires 1d;
    }

    # 入口不缓存，发版后用户刷新即得新版
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 应用为 hash 路由，无需 history 回退；未知路径回首页兜底
    location / {
        try_files $uri $uri/ /index.html;
    }
}
