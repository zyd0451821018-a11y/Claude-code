# ============================================================
# 丑团 · 宿主机 Nginx server 块（域名反代，参考驭流-域名与Nginx配置规范）
# 放置：/etc/nginx/conf.d/choutuan.conf（或 sites-available 软链）
# 反代到容器映射端口 127.0.0.1:9000
#
# 证书（首次）：sudo certbot --nginx -d www.choutuan.cloudwaveai.cn
# （裸域 choutuan.cloudwaveai.cn 需先添加 DNS A 记录才能一并签发，否则整张证书失败）
# certbot 会自动把本文件改写为 443 + http→https 跳转
# ============================================================
server {
    listen 80;
    server_name www.choutuan.cloudwaveai.cn choutuan.cloudwaveai.cn;

    # 站点含 632 张商品图，首屏并发请求多，保持默认 keepalive 即可
    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
